[package]
name = "termtosvg"
version = "0.1.0-alpha"
edition = "2024"
repository = "https://github.com/jzombie/termtosvg-rs"

[dependencies]
anyhow = "1.0.100"
vte = "0.15.0"
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
thiserror = "2.0.17"
unicode-width = "0.2.2"
xmltree = "0.12.0"
include_dir = "0.7.4"
once_cell = "1.21.3"
log = "0.4.29"
env_logger = "0.11.8"
nix = { version = "0.30.1", features = ["term", "ioctl", "poll", "process", "fs"] }
shlex = "1.3.0"
tempfile = "3.24.0"
rand = "0.9.2"
indexmap = "2.12.1"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
