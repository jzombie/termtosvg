[package]
name = "termtosvg"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
vte = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
unicode-width = "0.1"
xmltree = "0.10"
include_dir = "0.7"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.27", features = ["term", "ioctl", "poll", "process", "fs"] }
shlex = "1"
tempfile = "3"
rand = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
